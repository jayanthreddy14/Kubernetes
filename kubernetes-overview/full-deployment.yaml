#  **Deployment YAML fields** one by one, explaining **what they mean** and **why they’re needed in professional setups**. This will give you a solid reference for interviews and production work.

# ---

# ## 📄 Top‑Level Fields
# - **`apiVersion: apps/v1`** → Defines which Kubernetes API version you’re using. `apps/v1` is the stable version for Deployments.
# - **`kind: Deployment`** → Tells Kubernetes this manifest is a Deployment resource.
# - **`metadata`**
#   - `name` → Unique identifier for the Deployment.
#   - `namespace` → Logical grouping (e.g., `production`, `staging`).
#   - `labels` → Key/value tags used for grouping, selectors, monitoring.
#   - `annotations` → Extra metadata (used by tools like Prometheus, Istio, CI/CD).

# ---

# ## ⚙️ Deployment Spec (`spec`)
# - **`replicas`** → Number of pod copies to run. Ensures availability and scaling.
# - **`selector`**
#   - `matchLabels` → Must match pod template labels; ensures Deployment manages the right pods.
#   - `matchExpressions` → Advanced label matching (e.g., multiple conditions).
# - **`strategy`**
#   - `type` → `RollingUpdate` (default, safer) or `Recreate` (all old pods killed first).
#   - `rollingUpdate`
#     - `maxUnavailable` → How many pods can be down during rollout.
#     - `maxSurge` → How many extra pods can be created temporarily.
# - **`minReadySeconds`** → Ensures pods stay “ready” for a minimum time before considered available (helps avoid flapping).
# - **`revisionHistoryLimit`** → Number of old ReplicaSets kept for rollback.
# - **`progressDeadlineSeconds`** → Max time rollout can take before marked failed.

# ---

# ## 🟢 Pod Template (`spec.template`)
# - **`metadata.labels`** → Must match Deployment selector; also used for Service routing.
# - **`metadata.annotations`** → Pod‑specific metadata (e.g., Istio sidecar injection).

# ### Pod Spec (`spec`)
# - **`serviceAccountName`** → Assigns a service account for RBAC permissions.
# - **`restartPolicy`** → Usually `Always` for Deployments.
# - **`terminationGracePeriodSeconds`** → Time given for graceful shutdown.
# - **`dnsPolicy`** → DNS resolution policy (`ClusterFirst` is default).
# - **`schedulerName`** → Custom scheduler if needed.

# ---

# ## 🟣 Containers
# - **`name`** → Container name.
# - **`image`** → Container image (with tag).
# - **`imagePullPolicy`** → Controls when image is pulled (`Always`, `IfNotPresent`).
# - **`ports`** → Exposed container ports.
# - **`env`** → Environment variables.
#   - `value` → Static values.
#   - `valueFrom` → Dynamic values (ConfigMap, Secret, Downward API).
# - **`resources`**
#   - `requests` → Minimum guaranteed CPU/memory.
#   - `limits` → Maximum allowed CPU/memory.
# - **`volumeMounts`** → Mount volumes inside container.
# - **Probes**
#   - `livenessProbe` → Checks if container is alive; restarts if failing.
#   - `readinessProbe` → Checks if container is ready to serve traffic.
#   - `startupProbe` → Ensures container starts correctly before other probes.
# - **`command` / `args`** → Override container entrypoint.
# - **`securityContext`**
#   - `runAsUser` / `runAsGroup` → Run as non‑root user.
#   - `privileged` → Whether container can run privileged.
#   - `readOnlyRootFilesystem` → Enforces immutability for security.

# ---

# ## 🟡 Init Containers
# - Run before main containers.
# - Used for setup tasks (e.g., DB migration, config download).

# ---

# ## 🔵 Volumes
# - **`configMap`** → Inject configuration files.
# - **`secret`** → Inject sensitive data.
# - **`emptyDir`** → Temporary scratch space.
# - **`persistentVolumeClaim`** → Persistent storage.

# ---

# ## 🟠 Scheduling
# - **`affinity`**
#   - `nodeAffinity` → Place pods on specific nodes.
#   - `podAffinity` → Place pods near certain pods.
#   - `podAntiAffinity` → Spread pods across nodes.
# - **`tolerations`** → Allow pods on tainted nodes.
# - **`nodeSelector`** → Simple node placement rules.

# ---

# ## ⚡ Why These Fields Matter in Production
# - **Strategy** → Controls rollout safety and downtime.
# - **Probes** → Prevents bad pods from serving traffic.
# - **Resources** → Ensures fair scheduling and avoids resource starvation.
# - **Affinity/Tolerations** → Guarantees HA and workload distribution.
# - **SecurityContext** → Enforces non‑root, secure containers.
# - **RevisionHistoryLimit** → Enables quick rollback.
# - **Annotations/Labels** → Critical for monitoring, logging, and CI/CD automation.



apiVersion: apps/v1              # API version for Deployment resource
kind: Deployment                 # Resource type is Deployment
metadata:
  name: myapp-deployment         # Name of the Deployment
  namespace: production          # Namespace (logical grouping)
  labels:                        # Labels for identification and selectors
    app: myapp
    tier: backend
  annotations:                   # Extra metadata (used by tools/monitoring)
    monitoring: "enabled"
    rollout: "rolling-update"

spec:
  replicas: 4                    # Number of pod replicas to run
  revisionHistoryLimit: 5        # Keep 5 old ReplicaSets for rollback
  minReadySeconds: 30            # Pod must be ready for 30s before marked available
  progressDeadlineSeconds: 600   # Max rollout time before considered failed

  strategy:                      # Deployment strategy
    type: RollingUpdate          # Options: RollingUpdate or Recreate
    rollingUpdate:
      maxUnavailable: 1          # Max pods unavailable during update
      maxSurge: 1                # Max extra pods allowed temporarily

  selector:                      # Must match pod template labels
    matchLabels:
      app: myapp

  template:                      # Pod template specification
    metadata:
      labels:
        app: myapp
        version: v2              # Version label for rollout tracking
      annotations:
        sidecar.istio.io/inject: "true"   # Example: Istio sidecar injection

    spec:
      serviceAccountName: myapp-sa        # Service account for RBAC
      restartPolicy: Always               # Pods always restart on failure
      terminationGracePeriodSeconds: 30   # Graceful shutdown time
      dnsPolicy: ClusterFirst             # Default DNS policy
      schedulerName: default-scheduler    # Scheduler used

      containers:
      - name: myapp-container
        image: myorg/myapp:v2.0.0         # Container image with tag
        imagePullPolicy: IfNotPresent     # Pull policy (Always/IfNotPresent/Never)
        ports:
        - containerPort: 8080             # Exposed container port
          protocol: TCP

        env:                              # Environment variables
        - name: APP_ENV
          value: "production"
        - name: DB_PASSWORD
          valueFrom:                      # Secure value from Secret
            secretKeyRef:
              name: db-secret
              key: password

        resources:                        # Resource requests/limits
          requests:
            cpu: "500m"                   # Guaranteed CPU
            memory: "512Mi"               # Guaranteed memory
          limits:
            cpu: "1"                      # Max CPU
            memory: "1Gi"                 # Max memory

        volumeMounts:                     # Mount volumes inside container
        - name: config-volume
          mountPath: /etc/config

        livenessProbe:                    # Health check: is container alive?
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 2
          failureThreshold: 3

        readinessProbe:                   # Health check: ready to serve traffic?
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3

        startupProbe:                     # Health check: did container start correctly?
          httpGet:
            path: /startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          failureThreshold: 30

        securityContext:                  # Security settings
          runAsUser: 1000                 # Run as non-root user
          runAsGroup: 3000
          readOnlyRootFilesystem: true    # Prevent filesystem writes

      initContainers:                     # Run before main containers
      - name: init-db
        image: busybox
        command: ['sh', '-c', 'echo Initializing DB && sleep 10']

      volumes:                            # Volumes available to containers
      - name: config-volume
        configMap:
          name: myapp-config
      - name: secret-volume
        secret:
          secretName: app-secret

      affinity:                           # Advanced scheduling rules
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/os
                operator: In
                values:
                - linux

      tolerations:                        # Allow scheduling on tainted nodes
      - key: "dedicated"
        operator: "Equal"
        value: "backend"
        effect: "NoSchedule"



