# ## 🟢 What is a StatefulSet?
# - **Deployment vs StatefulSet**:  
#   - A **Deployment** manages stateless apps (pods are interchangeable).  
#   - A **StatefulSet** manages stateful apps (pods have stable identities and storage).  
# - **Key Features**:
#   - Stable, unique network IDs (`pod-0`, `pod-1`, …).
#   - Ordered, predictable pod startup and termination.
#   - Persistent storage via PVCs (each pod gets its own volume).
#   - Useful for apps like MySQL, Cassandra, Kafka, MongoDB.


apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-statefulset          # Name of the StatefulSet
  namespace: production            # Namespace for isolation
spec:
  serviceName: mysql-headless      # Headless service for stable DNS
  replicas: 3                      # Number of pods (mysql-0, mysql-1, mysql-2)
  selector:
    matchLabels:
      app: mysql
  template:                        # Pod template
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:5.7           # Container image
        ports:
        - containerPort: 3306      # MySQL default port
        env:                       # Environment variables
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret   # Secret storing root password
              key: password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql   # Persistent data directory
  volumeClaimTemplates:            # Each pod gets its own PVC
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi             # Each pod gets 5Gi storage

# ## ⚙️ Explanation of Fields
# - **`serviceName`** → Must point to a **headless Service** (`ClusterIP: None`). This gives each pod a stable DNS name like `mysql-0.mysql-headless.production.svc.cluster.local`.
# - **`replicas`** → Number of pods in the StatefulSet. Each pod gets a stable ordinal index.
# - **`template`** → Defines the pod spec (like in a Deployment).
# - **`volumeClaimTemplates`** → Ensures each pod gets its own PVC (e.g., `mysql-data-mysql-0`, `mysql-data-mysql-1`).
# - **`env` with `secretKeyRef`** → Securely injects sensitive values (like DB password).
# - **`volumeMounts`** → Mounts the PVC inside the container at `/var/lib/mysql`.


# ## 🏢 Enterprise Use Cases
# - **Databases** → MySQL, PostgreSQL, MongoDB.
# - **Message Queues** → Kafka, RabbitMQ.
# - **Distributed Systems** → Cassandra, Elasticsearch.
# - **Clustered Apps** → Apps needing stable identities and persistent storage.



# ## 🔄 Lifecycle Behavior
# - Pods are created in order: `mysql-0`, then `mysql-1`, then `mysql-2`.
# - Pods are terminated in reverse order.
# - Each pod keeps its identity and storage even if restarted.



# ✅ **Summary**:  
# StatefulSets are essential when pods need **stable identities and persistent storage**. They differ from Deployments by ensuring ordered startup/termination and unique PVCs per pod.

